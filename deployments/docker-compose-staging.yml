name: identity-provider-staging

x-kochwiki:
  client-secret: ${KOCHWIKI_CLIENT_SECRET:?Set KOCHWIKI_CLIENT_SECRET in deployments/.env}
  redirect-uris: ${KOCHWIKI_REDIRECT_URIS:?Set KOCHWIKI_REDIRECT_URIS in deployments/.env}
  logout-redirect-uris: ${KOCHWIKI_LOGOUT_REDIRECT_URIS:?Set KOCHWIKI_LOGOUT_REDIRECT_URIS in deployments/.env}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployments/.env}
      POSTGRES_DB: ${KC_DB_NAME:?Set KC_DB_NAME in deployments/.env}
      KC_DB_USER: ${KC_DB_USER:?Set KC_DB_USER in deployments/.env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in deployments/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$KC_DB_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME to the public URL in deployments/.env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KC_DB_NAME:?Set KC_DB_NAME in deployments/.env}
      KC_DB_USERNAME: ${KC_DB_USER:?Set KC_DB_USER in deployments/.env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in deployments/.env}
    command: start
    networks:
      - proxy
      - database

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:?Set BIND_PORT in deployments/.env}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak
    networks:
      - proxy

volumes:
  postgres-data:

networks:
  proxy:
  database:
    internal: true
